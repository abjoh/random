<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff7f3">
  <title>A Little Treasure Hunt</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="card" aria-live="polite">
    <div class="sparkle" aria-hidden="true">✦</div>
    <p class="eyebrow" id="eyebrow">A little adventure for you</p>
    <h1 id="message">Ready for a little surprise?</h1>
    <p class="subtext" id="subtext">Follow the clues. There’s something waiting at the end.</p>
    <div class="actions" id="actions">
      <button class="primary" id="start">Start <span aria-hidden="true">♥</span></button>
    </div>
    <div class="progress" id="progress" aria-label="Treasure hunt progress" hidden>
      <span></span><span></span><span></span><span></span>
    </div>
    <p class="step-label" id="step-label" hidden></p>
  </main>
  <footer>made with love <span aria-hidden="true">♥</span></footer>
  <script src="script.js"></script>
</body>
</html>
